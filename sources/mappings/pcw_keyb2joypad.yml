# pcw_keyb2joypad.yml -- per-game gamepad -> PCW-key map for the
# zesarpcw_libretro core. Maintained source; edit controls here and run
# `pcw_keyb2joypad_gen.py c` to rebuild the embedded C table.
# Initial catalogue metadata: MAME contributors, CC0-1.0.
# See licenses/MAPPINGS.md for the verified reference and scope.
#
# Identification: `sha1` (of the boot .dsk, canonical) or `id` (shortname).
# input_pad_*: <description> (<TOKEN>), or just <TOKEN> when the action is
# unknown. The configured OSK button overrides its slot; Select+Start aliases
# input_pad_r3 without assuming what the emulated key means for that game.
# conf: high|medium|low confidence of the binding (low = inferred by genre).

